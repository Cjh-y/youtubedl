name: Build YoutubeDL IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          echo "=== Xcode ==="
          xcode-select -p
          xcodebuild -version

          echo "=== iOS SDK ==="
          xcodebuild -showsdks

      - name: Resolve Swift Packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project YoutubeDL.xcodeproj \
            -scheme YoutubeDL

      - name: Build archive
        run: |
          set -e

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project YoutubeDL.xcodeproj \
            -scheme YoutubeDL \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/YoutubeDL.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Find app bundle
        run: |
          set -e

          echo "=== Searching for .app ==="

          find build/YoutubeDL.xcarchive \
            -type d \
            -name "*.app" \
            -print

          APP_PATH=$(find build/YoutubeDL.xcarchive \
            -type d \
            -name "*.app" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found!"
            exit 1
          fi

          echo ""
          echo "Found app:"
          echo "$APP_PATH"

          echo "$APP_PATH" > build/app_path.txt

      - name: Create IPA
        run: |
          set -e

          APP_PATH=$(cat build/app_path.txt)

          echo "Using:"
          echo "$APP_PATH"

          rm -rf build/Payload
          mkdir -p build/Payload
          mkdir -p build/IPA

          cp -R "$APP_PATH" build/Payload/YoutubeDL.app

          cd build

          rm -f YoutubeDL.ipa

          echo "Creating IPA..."

          zip -r -q YoutubeDL.ipa Payload

          mv YoutubeDL.ipa IPA/YoutubeDL.ipa

          echo ""
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh IPA/YoutubeDL.ipa

      - name: Verify IPA
        run: |
          set -e

          IPA="build/IPA/YoutubeDL.ipa"

          echo "=== IPA file ==="
          ls -lh "$IPA"

          echo ""
          echo "=== IPA contents ==="

          unzip -l "$IPA"

          echo ""
          echo "=== Checking Payload ==="

          unzip -l "$IPA" | grep "Payload/"

          echo ""
          echo "IPA verification successful."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDL-IPA
          path: build/IPA/YoutubeDL.ipa
          if-no-files-found: error

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDL-xcarchive
          path: build/YoutubeDL.xcarchive
          if-no-files-found: error