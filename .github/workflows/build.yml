name: Build YoutubeDL IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          echo "=== Xcode ==="
          xcode-select -p
          xcodebuild -version
          echo "=== iOS SDK ==="
          xcodebuild -showsdks

      - name: Resolve Swift Packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project YoutubeDL.xcodeproj \
            -scheme YoutubeDL

      - name: Build archive
        run: |
          set -e

          mkdir -p build

          xcodebuild \
            -project YoutubeDL.xcodeproj \
            -scheme YoutubeDL \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/YoutubeDL.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Inspect archive
        run: |
          echo "========================================"
          echo "Archive contents"
          echo "========================================"

          find build/YoutubeDL.xcarchive -maxdepth 6 -print

          echo ""
          echo "========================================"
          echo ".app bundles"
          echo "========================================"

          find build/YoutubeDL.xcarchive \
            -type d \
            -name "*.app" \
            -print

      - name: Create unsigned IPA
        run: |
          set -e

          echo "Searching for YoutubeDL.app..."

          APP_PATH=$(find build/YoutubeDL.xcarchive \
            -type d \
            -name "YoutubeDL.app" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "ERROR: YoutubeDL.app was not found!"
            echo ""
            echo "Available .app bundles:"
            find build/YoutubeDL.xcarchive \
              -type d \
              -name "*.app" \
              -print

            exit 1
          fi

          echo ""
          echo "Found:"
          echo "$APP_PATH"
          echo ""

          rm -rf build/Payload
          mkdir -p build/Payload
          mkdir -p build/IPA

          cp -R "$APP_PATH" \
            build/Payload/YoutubeDL.app

          echo "Creating IPA..."

          cd build

          rm -f YoutubeDL.ipa

          zip -r -q YoutubeDL.ipa Payload

          mv YoutubeDL.ipa IPA/YoutubeDL.ipa

          echo ""
          echo "IPA created successfully:"
          ls -lh IPA/YoutubeDL.ipa

      - name: Verify IPA
        run: |
          set -e

          IPA="build/IPA/YoutubeDL.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA does not exist!"
            exit 1
          fi

          echo "IPA size:"
          ls -lh "$IPA"

          echo ""
          echo "IPA contents:"
          unzip -l "$IPA"

          echo ""
          echo "IPA verification completed."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDL-IPA
          path: build/IPA/YoutubeDL.ipa
          if-no-files-found: error

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDL-xcarchive
          path: build/YoutubeDL.xcarchive
          if-no-files-found: error