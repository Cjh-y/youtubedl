name: Build YoutubeDL IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift Packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project YoutubeDL.xcodeproj \
            -scheme YoutubeDL

      - name: Build archive
        run: |
          mkdir -p build

          xcodebuild \
            -project YoutubeDL.xcodeproj \
            -scheme YoutubeDL \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/YoutubeDL.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            -resultBundlePath "$PWD/build/YoutubeDL.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Create unsigned IPA
        run: |
          mkdir -p build/IPA

          mkdir -p build/Payload
          cp -R build/YoutubeDL.xcarchive/Products/Applications/YoutubeDL.app \
                build/Payload/

          cd build
          zip -r YoutubeDL.ipa Payload

          mv YoutubeDL.ipa IPA/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDL-IPA
          path: build/IPA/YoutubeDL.ipa
          if-no-files-found: error

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDL-xcarchive
          path: build/YoutubeDL.xcarchive
          if-no-files-found: error